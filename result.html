<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">

    <title>🐷 天命猪格鉴定报告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(ellipse at 50% 0%, #1a0f0a 0%, #0d0806 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', serif;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(200, 150, 100, 0.10);
            border-radius: 56px;
            padding: 40px 32px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7);
            animation: fadeUp 0.9s ease-out;
            position: relative;
        }
        .card::before {
            content: '◆ ◇ ◆ ◇ ◆';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(200, 150, 100, 0.05);
            font-size: 11px;
            letter-spacing: 8px;
            background: #0d0806;
            padding: 0 16px;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0) rotate(-3deg);
            }
            50% {
                transform: translateY(-6px) rotate(3deg);
            }
        }
        .pig-emoji {
            font-size: 72px;
            text-align: center;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        .center {
            text-align: center;
        }
        .badge-main {
            display: inline-block;
            background: linear-gradient(135deg, #8b6b4a, #c49a6c);
            color: #0d0806;
            font-weight: 700;
            font-size: 24px;
            padding: 6px 28px;
            border-radius: 40px;
            margin: 8px 0 4px;
            letter-spacing: 3px;
            font-family: 'Georgia', serif;
        }
        .title {
            text-align: center;
            margin: 4px 0;
        }
        .title h1 {
            color: #e8d5b8;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .title .sub {
            color: rgba(200, 150, 100, 0.18);
            font-size: 12px;
            letter-spacing: 4px;
            font-style: italic;
        }
        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200, 150, 100, 0.10), transparent);
            margin: 14px auto;
        }
        .section-title {
            color: rgba(200, 150, 100, 0.18);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 12px 0 6px;
            font-family: 'Segoe UI', sans-serif;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 6px 0 10px;
        }
        .grid-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(200, 150, 100, 0.04);
            border-radius: 14px;
            padding: 10px 6px;
            text-align: center;
        }
        .grid-item .label {
            color: rgba(200, 150, 100, 0.12);
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .grid-item .value {
            color: #e8d5b8;
            font-size: 15px;
            font-weight: 700;
            margin-top: 2px;
            letter-spacing: 1px;
        }
        .grid-item .value.gold {
            color: #c49a6c;
        }
        .grid-item .value.purple {
            color: #b8a0d4;
        }
        .trait-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin: 4px 0 8px;
        }
        .trait {
            background: rgba(200, 150, 100, 0.05);
            border: 1px solid rgba(200, 150, 100, 0.05);
            border-radius: 30px;
            padding: 4px 16px;
            color: rgba(200, 150, 100, 0.5);
            font-size: 13px;
            font-style: italic;
        }
        .desc-box {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 14px 16px;
            margin: 4px 0 8px;
            border-left: 2px solid rgba(200, 150, 100, 0.08);
        }
        .desc-box p {
            color: rgba(200, 150, 100, 0.55);
            font-size: 14px;
            line-height: 1.9;
            font-style: italic;
        }
        .desc-box strong {
            color: #e8d5b8;
            font-style: normal;
        }
        .personality-box {
            background: linear-gradient(135deg, rgba(200, 150, 100, 0.06), rgba(200, 150, 100, 0.02));
            border: 1px solid rgba(200, 150, 100, 0.08);
            border-radius: 16px;
            padding: 18px 20px;
            margin: 8px 0 10px;
            position: relative;
        }
        .personality-box::before {
            content: '🧠';
            position: absolute;
            top: -10px;
            left: 16px;
            font-size: 18px;
            background: #0d0806;
            padding: 0 6px;
        }
        .personality-box .label {
            color: rgba(200, 150, 100, 0.12);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 6px;
        }
        .personality-box .content {
            color: rgba(200, 150, 100, 0.6);
            font-size: 15px;
            line-height: 1.8;
            font-style: italic;
        }
        .personality-box .content strong {
            color: #c49a6c;
            font-style: normal;
            font-weight: 700;
        }
        .oracle-box {
            background: rgba(200, 150, 100, 0.02);
            border: 1px solid rgba(200, 150, 100, 0.04);
            border-radius: 14px;
            padding: 14px 18px;
            margin: 8px 0;
            text-align: center;
        }
        .oracle-box .label {
            color: rgba(200, 150, 100, 0.10);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        .oracle-box .content {
            color: rgba(200, 150, 100, 0.5);
            font-size: 15px;
            margin-top: 4px;
            font-style: italic;
            line-height: 1.6;
        }
        .oracle-box .content .highlight {
            color: #c49a6c;
            font-style: normal;
        }
        .btn-share {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(200, 150, 100, 0.06);
            border-radius: 20px;
            background: transparent;
            color: rgba(200, 150, 100, 0.2);
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 16px;
            letter-spacing: 3px;
            font-family: 'Georgia', serif;
        }
        .btn-share:hover {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(200, 150, 100, 0.12);
            color: rgba(200, 150, 100, 0.5);
        }
        .footer {
            color: rgba(200, 150, 100, 0.04);
            text-align: center;
            font-size: 10px;
            margin-top: 14px;
            letter-spacing: 3px;
        }
        @media (max-width: 480px) {
            .card {
                padding: 28px 18px;
            }
            .grid-3 {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 5px;
            }
            .grid-item .value {
                font-size: 13px;
            }
            .badge-main {
                font-size: 20px;
                padding: 4px 20px;
            }
            .title h1 {
                font-size: 17px;
            }
            .personality-box .content {
                font-size: 14px;
            }
        }
    </style>
</head>

            care: '🍽️ 饲养指南：这头猪<strong>白天别吵他</strong>，让他睡。投喂要<strong>集中在晚上</strong>，半夜加餐他会感动哭。建议提供<strong>暖色灯光</strong>和<strong>安静环境</strong>。注意：他的<strong>灵魂在夜晚苏醒</strong>，如果你想听到他最真实的想法——<strong>半夜找他聊天</strong>。'
        }];

        // ============================================================
        // 八字推演
        // ============================================================

        var TIANGAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
        var DIZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
        var SHENGXIAO = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
        var ZODIAC_SIGNS = ['摩羯', '水瓶', '双鱼', '白羊', '金牛', '双子', '巨蟹', '狮子', '处女', '天秤', '天蝎', '射手'];

        function getZodiac(month, day) {
            var dates = [20, 19, 21, 20, 21, 22, 23, 23, 23, 24, 23, 22];
            var idx;
            if (month === 1 && day <= dates[0]) {
                idx = 11;
            } else if (day <= dates[month - 1]) {
                idx = month - 1;
            } else {
                idx = month;
            }
            return ZODIAC_SIGNS[idx % 12];
        }

        function getBaZi(year, month, day) {
            var yearStem = TIANGAN[(year - 4) % 10];
            var yearBranch = DIZHI[(year - 4) % 12];
            var monthStem = TIANGAN[(month + 1) % 10];
            var monthBranch = DIZHI[(month + 1) % 12];
            var dayStem = TIANGAN[(day + month) % 10];
            var dayBranch = DIZHI[(day + month) % 12];
            return {
                year: yearStem + yearBranch,
                month: monthStem + monthBranch,
                day: dayStem + dayBranch,
                shengxiao: SHENGXIAO[(year - 4) % 12]
            };
        }

        // ============================================================
        // 核心算法
        // ============================================================

        function getPigIndex(month, day, year, q1, q2, q3) {
            var qMap = { 'A': 1, 'B': 2, 'C': 3, 'D': 4 };
            var qSum = qMap[q1] + qMap[q2] + qMap[q3];
            var bazi = getBaZi(year, month, day);
            var hash = (bazi.year.charCodeAt(0) * 31 +
                    bazi.month.charCodeAt(0) * 17 +
                    bazi.day.charCodeAt(0) * 7 +
                    month * 13 +
                    day * 5 +
                    qSum * 11) % 12;
            return hash;
        }

        // ============================================================
        // 生成性格侧写
        // ============================================================

        var TRAIT_MAP = {
            'q1_A': '挑战者',
            'q1_B': '品味家',
            'q1_C': '冒险者',
            'q1_D': '务实者',
            'q2_A': '自由魂',
            'q2_B': '敏感心',
            'q2_C': '安全感',
            'q2_D': '重情义',
            'q3_A': '知足者',
            'q3_B': '探索者',
            'q3_C': '逍遥派',
            'q3_D': '意义追寻者'
        };

        function generatePersonality(q1, q2, q3) {
            var t1 = TRAIT_MAP['q1_' + q1] || '未知';
            var t2 = TRAIT_MAP['q2_' + q2] || '未知';
            var t3 = TRAIT_MAP['q3_' + q3] || '未知';

            var templates = [
                '你是一个<strong>' + t1 + '</strong>型的人。你渴望' + (q1 === 'A' ? '征服与突破' : q1 === 'B' ? '优雅与品质' : q1 === 'C' ? '速度与激情' : '安稳与实在') + '。你的内心深处住着一个<strong>' + t2 + '</strong>，' + (q2 === 'A' ? '讨厌被任何形式的牢笼困住' : q2 === 'B' ? '比谁都在意别人眼中的自己' : q2 === 'C' ? '最怕的是失去基本的安全感' : q2 === 'D' ? '表面坚强，其实最怕被丢下') + '。而你对未来的态度是一个<strong>' + t3 + '</strong>——' + (q3 === 'A' ? '你相信快乐就是最大的意义' : q3 === 'B' ? '你永远对未知保持好奇' : q3 === 'C' ? '你的终极追求是自由自在' : q3 === 'D' ? '你愿意用辛苦换取值得的人生') + '。',

                '你的人生哲学是：<strong>' + t1 + ' + ' + t2 + ' + ' + t3 + '</strong>。你喜欢' + (q1 === 'A' ? '不按常理出牌' : q1 === 'B' ? '把日子过出仪式感' : q1 === 'C' ? '活在此刻的快感中' : q1 === 'D' ? '低调地做好自己的事') + '。你害怕' + (q2 === 'A' ? '被驯服' : q2 === 'B' ? '被误解' : q2 === 'C' ? '没着落' : q2 === 'D' ? '被遗忘') + '。你相信' + (q3 === 'A' ? '开心就好' : q3 === 'B' ? '世界很大值得去看看' : q3 === 'C' ? '不要被任何东西绑架' : q3 === 'D' ? '人生必须有意义') + '。',

                '你的心性密码是 <strong>「' + t1 + ' · ' + t2 + ' · ' + t3 + '」</strong>。你像一只' + (q1 === 'A' ? '翻山越岭的野猪' : q1 === 'B' ? '优雅踱步的香猪' : q1 === 'C' ? '横冲直撞的暴走猪' : q1 === 'D' ? '默默拱土的憨猪') + '。你的软肋是' + (q2 === 'A' ? '被圈养' : q2 === 'B' ? '被否定' : q2 === 'C' ? '饿肚子' : q2 === 'D' ? '没朋友') + '。你的终极信念是' + (q3 === 'A' ? '快乐无罪' : q3 === 'B' ? '生命在于体验' : q3 === 'C' ? '自由万岁' : q3 === 'D' ? '活出意义') + '。'
            ];

            return templates[Math.floor(Math.random() * templates.length)];
        }

        // ============================================================
        // 其他辅助
        // ============================================================

        function getOracle(name, bazi, pig) {
            var list = [
                '观' + name + '之猪相，' + bazi.year + '年' + bazi.month + '月' + bazi.day + '日生，得天蓬之气，秉' + pig.traits[0] + '之德。此猪' + pig.traits[1] + '，今生' + pig.traits[2] + '。宜投喂，忌打压。',
                name + '者，' + bazi.shengxiao + '命，猪格清奇。此猪生而' + pig.traits[0] + '，长而' + pig.traits[1] + '，终而' + pig.traits[2] + '。遇水则发，遇饭则狂，遇良人则安。',
                '乾道成猪，坤道成猪。' + name + '之猪格，得天地之气，兼五行之妙。此生唯一缺憾：太可爱。'
            ];
            return list[Math.floor(Math.random() * list.length)];
        }

        var PIG_FACTS = [
            '今日宜拱泥，忌洗澡 🛁',
            '猪运指数：★★★★★ 宜加餐 🍖',
            '今日幸运物：红薯，见到就炫 🍠',
            '宇宙提醒：你该吃宵夜了 🌙',
            '今日宜：撒娇，忌：加班 😤',
            '猪生建议：躺平就是胜利 ✌️',
            '今日不宜减肥，宜干饭 🍚',
            '注意：今日有猪运，出门可能捡到吃的 🎉',
            '今日宜：晒太阳，忌：想太多 ☀️',
            '猪生格言：能吃是福，能睡是德 😴'
        ];

        // ============================================================
        // 渲染
        // ============================================================

        var params = new URLSearchParams(window.location.search);
        var name = params.get('name') || '无名氏';
        var birthday = params.get('birthday');
        var q1 = params.get('q1') || 'A';
        var q2 = params.get('q2') || 'A';
        var q3 = params.get('q3') || 'A';

        if (!birthday) {
            document.getElementById('resultCard').innerHTML = '<div style="text-align:center;color:#e8d5b8;padding:40px 20px;"><div style="font-size:60px;">🐷</div><h1 style="margin-top:16px;font-weight:300;letter-spacing:4px;">请从鉴定所进入</h1></div>';
        } else {
            var parts = birthday.split('-');
            var year = parseInt(parts[0]);
            var month = parseInt(parts[1]);
            var day = parseInt(parts[2]);

            var zodiac = getZodiac(month, day);
            var bazi = getBaZi(year, month, day);
            var pigIdx = getPigIndex(month, day, year, q1, q2, q3);
            var pig = PIGS[pigIdx];

            var personality = generatePersonality(q1, q2, q3);
            var randomFact = PIG_FACTS[(month * day + pigIdx) % PIG_FACTS.length];
            var oracle = getOracle(name, bazi, pig);

            var html = '';
            html += '<span class="pig-emoji">' + pig.emoji + '</span>';
            html += '<div class="center"><div class="badge-main">' + pig.badge + '</div></div>';
            html += '<div class="title"><h1>🐽 ' + name + ' · 天命猪格鉴定报告</h1>';
            html += '<div class="sub">· ' + month + '月' + day + '日 · ' + zodiac + ' · ' + bazi.shengxiao + '年 ·</div></div>';
            html += '<div class="divider"></div>';

            html += '<div class="grid-3">';
            html += '<div class="grid-item"><div class="label">🌟 星象猪格</div><div class="value gold">' + zodiac + '猪</div></div>';
            var elementColor = pig.element === '金' ? '#c49a6c' : pig.element === '木' ? '#9ab88a' : pig.element === '水' ? '#8ab4c9' : pig.element === '火' ? '#c97a6a' : '#b8a0d4';
            html += '<div class="grid-item"><div class="label">🔥 五行猪性</div><div class="value" style="color:' + elementColor + ';">' + pig.elementEmoji + ' ' + pig.element + '猪</div></div>';
            html += '<div class="grid-item"><div class="label">☯ 八字猪柱</div><div class="value purple">' + bazi.year + '·' + bazi.month + '·' + bazi.day + '</div></div>';
            html += '</div>';

            html += '<div class="divider"></div>';
            html += '<div class="personality-box"><div class="label">🧠 心性侧写 · 来自你的三问答案</div><div class="content">' + personality + '</div></div>';
            html += '<div class="divider"></div>';

            html += '<div class="section-title">🧬 天命猪格</div>';
            html += '<div class="trait-list">';
            for (var i = 0; i < pig.traits.length; i++) {
                html += '<span class="trait">#' + pig.traits[i] + '</span>';
            }
            html += '</div>';

            html += '<div class="divider"></div>';
            html += '<div class="section-title">📝 本命猪性</div>';
            html += '<div class="desc-box"><p>' + pig.description + '</p></div>';

            html += '<div class="section-title">🍽️ 饲养指南</div>';
            html += '<div class="desc-box" style="border-left-color: rgba(200,150,100,0.15);"><p>' + pig.care + '</p></div>';

            html += '<div class="oracle-box"><div class="label">📜 天命猪签</div><div class="content">“<span class="highlight">' + oracle + '</span>”</div></div>';

            html += '<div class="oracle-box" style="background:rgba(200,150,100,0.015); border-color:rgba(200,150,100,0.03);"><div class="label">🐽 今日猪事</div><div class="content" style="font-size:14px;">' + randomFact + '</div></div>';

            html += '<button class="btn-share" onclick="copyLink()">📋 复制我的天命猪格 · 分享猪缘</button>';
            html += '<div class="footer">☯ 星象×八字×心性 · 三合一定命 · 仅供娱乐</div>';

            document.getElementById('resultCard').innerHTML = html;
        }

        function copyLink() {
            var url = window.location.href;
            navigator.clipboard.writeText(url).then(function() {
                var btn = document.querySelector('.btn-share');
                btn.textContent = '✅ 已复制！快去炫耀你的猪格吧 🐷';
                setTimeout(function() {
                    btn.textContent = '📋 复制我的天命猪格 · 分享猪缘';
                }, 2000);
            }).catch(function() {
                alert('复制链接: ' + url);
            });
        }
    </script>
