<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐷 心性三问</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0806;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(196, 154, 108, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(196, 154, 108, 0.03) 0%, transparent 60%);
        }

        /* ===== 主卡片 ===== */
        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(200, 150, 100, 0.08);
            border-radius: 48px;
            padding: 40px 32px 36px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            animation: fadeUp 0.7s ease-out;
            position: relative;
        }

        .card::before {
            content: '◆ ◇ ◆ ◇ ◆';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(200, 150, 100, 0.05);
            font-size: 10px;
            letter-spacing: 10px;
            background: #0d0806;
            padding: 0 16px;
            white-space: nowrap;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 进度条 ===== */
        .progress-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 16px;
        }

        .progress-text {
            color: rgba(200, 150, 100, 0.15);
            font-size: 12px;
            letter-spacing: 4px;
            white-space: nowrap;
            font-style: italic;
        }

        .progress-bar {
            flex: 1;
            height: 2px;
            background: rgba(200, 150, 100, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #7a5d40, #b58a60);
            border-radius: 4px;
            transition: width 0.6s ease;
            width: 0%;
        }

        /* ===== 圆点导航 ===== */
        .dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(200, 150, 100, 0.06);
            transition: 0.4s;
        }

        .dot.active {
            background: rgba(200, 150, 100, 0.25);
            transform: scale(1.25);
        }

        .dot.done {
            background: rgba(200, 150, 100, 0.12);
        }

        /* ===== 题目标题 ===== */
        .question-number {
            color: rgba(200, 150, 100, 0.12);
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-family: -apple-system, 'Segoe UI', sans-serif;
        }

        .question-text {
            color: #e8d5b8;
            font-size: 22px;
            font-weight: 700;
            margin: 6px 0 18px;
            line-height: 1.6;
            min-height: 60px;
        }

        /* ===== 选项 ===== */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid rgba(200, 150, 100, 0.05);
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: 0.3s;
            color: rgba(200, 150, 100, 0.5);
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(200, 150, 100, 0.10);
        }

        .option.selected {
            border-color: rgba(200, 150, 100, 0.2);
            background: rgba(200, 150, 100, 0.06);
            color: #e8d5b8;
        }

        .option input[type="radio"] {
            display: none;
        }

        .option .letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(200, 150, 100, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: rgba(200, 150, 100, 0.12);
            flex-shrink: 0;
            transition: 0.3s;
            font-family: -apple-system, sans-serif;
        }

        .option.selected .letter {
            border-color: #b58a60;
            color: #b58a60;
            background: rgba(181, 138, 96, 0.08);
        }

        .option .label {
            font-size: 15px;
            line-height: 1.4;
        }

        .option .sub-label {
            font-size: 12px;
            color: rgba(200, 150, 100, 0.2);
            font-style: italic;
            display: block;
            margin-top: 2px;
        }

        /* ===== 按钮 ===== */
        .nav-buttons {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #7a5d40, #b58a60);
            color: #0d0806;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 3px;
            font-family: 'Georgia', serif;
        }

        .btn:hover {
            transform: scale(1.01);
            box-shadow: 0 10px 40px rgba(196, 154, 108, 0.08);
        }

        .btn:disabled {
            opacity: 0.12;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(200, 150, 100, 0.06);
            color: rgba(200, 150, 100, 0.2);
            letter-spacing: 2px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(200, 150, 100, 0.12);
            color: rgba(200, 150, 100, 0.4);
            box-shadow: none;
        }

        /* ===== Footer ===== */
        .footer {
            color: rgba(200, 150, 100, 0.03);
            text-align: center;
            font-size: 10px;
            margin-top: 18px;
            letter-spacing: 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .card {
                padding: 28px 18px 24px;
                border-radius: 36px;
            }
            .question-text {
                font-size: 19px;
                min-height: 50px;
            }
            .option .label {
                font-size: 14px;
            }
            .btn {
                font-size: 13px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- 进度条 -->
        <div class="progress-wrap">
            <span class="progress-text" id="progressText">0 / 3</span>
            <div class="progress-bar">
                <div class="fill" id="progressFill"></div>
            </div>
        </div>

        <!-- 圆点 -->
        <div class="dots" id="dots"></div>

        <!-- 题目容器 -->
        <div id="questionContainer">
            <div class="question-number" id="qNumber">问题 1 / 3</div>
            <div class="question-text" id="qText">加载中...</div>
            <div class="options" id="optionsContainer"></div>
        </div>

        <!-- 按钮 -->
        <div class="nav-buttons">
            <button class="btn btn-secondary" id="prevBtn" disabled>← 上一题</button>
            <button class="btn" id="nextBtn" disabled>下一题 →</button>
        </div>

        <div class="footer">☯ 凭第一直觉选 · 无对错</div>
    </div>

    <script>
        // ============================================================
        // 🐷 三道心性暗题
        // ============================================================

        const QUESTIONS = [{
            id: 'q1',
            text: '🐷 如果猪会开车，你觉得ta会买什么车？',
            options: [
                { value: 'A', label: '越野车，翻山越岭那种', sub: '喜欢挑战，不畏艰难' },
                { value: 'B', label: '复古小轿车，优雅地开', sub: '注重品味，享受过程' },
                { value: 'C', label: '速度超快的跑车，轰油门', sub: '追求刺激，活在当下' },
                { value: 'D', label: '一辆不起眼的二手车', sub: '低调务实，不喜张扬' }
            ]
        }, {
            id: 'q2',
            text: '🐽 如果你是一头猪，你最怕什么？',
            options: [
                { value: 'A', label: '被关在猪圈里一辈子', sub: '渴望自由，厌恶束缚' },
                { value: 'B', label: '被所有人当成笨猪', sub: '在意别人看法，渴望被认可' },
                { value: 'C', label: '没有好吃的，饿肚子', sub: '务实主义者，安全感第一' },
                { value: 'D', label: '孤独终老，没有朋友', sub: '重感情，害怕被孤立' }
            ]
        }, {
            id: 'q3',
            text: '🐗 如果有下辈子，你还想当猪吗？',
            options: [
                { value: 'A', label: '当！猪生太快乐了', sub: '乐观知足，享受当下' },
                { value: 'B', label: '换一种动物试试', sub: '好奇心强，喜欢新体验' },
                { value: 'C', label: '只要不打工，当什么都行', sub: '自由至上，讨厌内卷' },
                { value: 'D', label: '当人吧，虽然累但有意思', sub: '追求意义，不惧挑战' }
            ]
        }];

        // ============================================================
        // 状态管理
        // ============================================================

        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || '无名氏';
        const birthday = params.get('birthday');

        let currentIndex = 0;
        const answers = {};

        // ============================================================
        // 渲染函数
        // ============================================================

        function renderDots() {
            const container = document.getElementById('dots');
            container.innerHTML = QUESTIONS.map((_, i) =>
                `<div class="dot ${i === currentIndex ? 'active' : (answers[QUESTIONS[i].id] ? 'done' : '')}"></div>`
            ).join('');
        }

        function updateProgress() {
            const total = QUESTIONS.length;
            const done = Object.keys(answers).length;
            const pct = Math.round((done / total) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = done + ' / ' + total;
        }

        function renderQuestion(index) {
            const q = QUESTIONS[index];
            document.getElementById('qNumber').textContent = '问题 ' + (index + 1) + ' / ' + QUESTIONS.length;
            document.getElementById('qText').innerHTML = q.text;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = q.options.map((opt, i) => `
                    <label class="option ${answers[q.id] === opt.value ? 'selected' : ''}">
                        <input type="radio" name="question" value="${opt.value}" 
                               ${answers[q.id] === opt.value ? 'checked' : ''}>
                        <span class="letter">${['A','B','C','D'][i]}</span>
                        <span class="label">${opt.label}<span class="sub-label">${opt.sub}</span></span>
                    </label>
                `).join('');

            container.querySelectorAll('.option').forEach(el => {
                el.addEventListener('click', function() {
                    const radio = this.querySelector('input[type="radio"]');
                    radio.checked = true;
                    answers[q.id] = radio.value;
                    container.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    updateButtons();
                    renderDots();
                    updateProgress();
                });
            });

            if (answers[q.id]) {
                const radio = container.querySelector(`input[value="${answers[q.id]}"]`);
                if (radio) radio.checked = true;
            }

            updateButtons();
            renderDots();
            updateProgress();
        }

        function updateButtons() {
            const q = QUESTIONS[currentIndex];
            const hasAnswer = !!answers[q.id];
            document.getElementById('nextBtn').disabled = !hasAnswer;
            document.getElementById('prevBtn').disabled = currentIndex === 0;

            const nextBtn = document.getElementById('nextBtn');
            if (currentIndex === QUESTIONS.length - 1) {
                nextBtn.textContent = '🔮 查看天命猪格';
            } else {
                nextBtn.textContent = '下一题 →';
            }
        }

        // ============================================================
        // 提交 & 导航
        // ============================================================

        async function submitAnswers() {
            const data = {
                name: name,
                birthday: birthday,
                q1: answers.q1 || 'A',
                q2: answers.q2 || 'A',
                q3: answers.q3 || 'A'
            };

            try {
                await fetch('/api/record', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (err) {
                console.warn('后端记录失败，继续跳转');
            }

            const params = new URLSearchParams({
                name: name,
                birthday: birthday,
                q1: data.q1,
                q2: data.q2,
                q3: data.q3
            });
            window.location.href = '/result.html?' + params.toString();
        }

        function goToNext() {
            if (currentIndex < QUESTIONS.length - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
                document.querySelector('.card').scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                submitAnswers();
            }
        }

        function goToPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
                document.querySelector('.card').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // ============================================================
        // 键盘快捷键 & 初始化
        // ============================================================

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Enter') {
                if (!document.getElementById('nextBtn').disabled) goToNext();
            }
            if (e.key === 'ArrowLeft') {
                if (!document.getElementById('prevBtn').disabled) goToPrev();
            }
        });

        renderQuestion(0);
        document.getElementById('nextBtn').addEventListener('click', goToNext);
        document.getElementById('prevBtn').addEventListener('click', goToPrev);
    </script>

</body>
</html>
